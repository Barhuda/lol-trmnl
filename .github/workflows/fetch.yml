name: Fetch LoL stats

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-lol-stats
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_ID: ${{ vars.RIOT_ID }}
        run: python scripts/fetch.py

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Update data.json"
          git push
